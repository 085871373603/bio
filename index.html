<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6F8A35">
<title>Rana Arifin — Dashboard</title>
<!--
=====================================================================
 PANDUAN UPDATE CEPAT
 Urutan halaman: HEADER → BANNER (permanen) → PEMUTAR MEDIA (permanen) → MENU (3 per baris)
 Hampir semua konten diatur di bagian "1. KONFIGURASI" pada <script>.
 TEMA: Windows XP Luna Olive Green — ganti warna di :root (--xp-*) pada <style>.
---------------------------------------------------------------------
 • Tambah BANNER    → taruh gambar di folder yang sama, tambah baris di BANNERS
                      { src:'promo.jpg', href:'https://toko.com/produk', alt:'Promo' }
                      (href = tautan ala e-commerce, boleh dikosongkan bila hanya informasi)
 • Tambah MEDIA     → tambah baris di MEDIA { t:'Judul', src:'file.mp4' }
                      (src boleh .mp4 / .mp3 / tautan YouTube biasa, youtu.be, atau /live/)
 • Tambah MENU      → tambah baris di MENU (id harus unik). Pakai href:'...' untuk tautan,
                      atau open:'id-jendela' untuk membuka jendela. Jumlah per baris: COLS
 • Tambah ARTIKEL   → tambah <template id="a3"> berisi teks, lalu daftarkan di ARTICLES
 • Tambah JENDELA   → salin blok <section class="win" id="w-..."> lalu buat menu open:'w-...'
 • Reset urutan menu→ hapus data situs di browser (localStorage: menu_order)
=====================================================================
-->
<style>
/* ===== 1. TEMA: WINDOWS XP LUNA — OLIVE GREEN =====
   Warna tema ada di :root (--xp-*). Latar langit + bukit ada di body{background}. */
:root{--xp-face:#ECE9D8;--xp-frame:#6F8A35;--xp-frame-dark:#4E6724;--xp-border:#003C74;--xp-input-border:#7F9DB9;--xp-group:#D0D0BF;--xp-shadow:#ACA899;--xp-select:#316AC5}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} /* teks tidak bisa diseleksi */
textarea{-webkit-user-select:text;user-select:text} /* kolom ketik chat tetap bisa dipakai */
svg,img,a{-webkit-user-drag:none}
button,a{font:inherit;color:inherit}
:focus-visible{outline:1px dotted #000;outline-offset:2px}
body{font-family:Tahoma,'Segoe UI',Verdana,sans-serif;font-size:12px;color:#000;min-height:100vh;padding:calc(16px + env(safe-area-inset-top,0px)) 10px calc(24px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(60px 22px at 18% 22%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
    radial-gradient(90px 28px at 30% 28%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),
    radial-gradient(80px 24px at 72% 16%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%),
    radial-gradient(130% 55% at 22% 112%,#7cc03a 0%,#58a024 42%,rgba(88,160,36,0) 43%),
    radial-gradient(120% 50% at 88% 114%,#66ae2c 0%,#3f8a1a 46%,rgba(63,138,26,0) 47%),
    linear-gradient(180deg,#1f5fd0 0%,#4a8fe3 38%,#8ec2f1 62%,#c7e3f8 78%,#6fa83c 78.2%,#4b9122 100%);
  background-attachment:fixed}

/* ===== 2. JENDELA XP (.window = halaman utama, .win = jendela Artikel/Interaksi) ===== */
.window,.win{background:var(--xp-frame);border:1px solid var(--xp-frame-dark);border-radius:8px 8px 0 0;padding:0 3px 3px;box-shadow:2px 3px 12px rgba(0,0,0,.55)}
.main{max-width:640px;margin:0 auto}
.title-bar{height:29px;margin:0 -3px;padding:0 5px 0 8px;border-radius:7px 7px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;font-family:'Trebuchet MS',Tahoma,sans-serif;font-weight:bold;font-size:13px;text-shadow:1px 1px 0 #3B4D1A;
  background:linear-gradient(180deg,#C2D58A 0%,#9CB45B 4%,#8FAA4F 8%,#83A044 14%,#7A9839 24%,#7A993C 56%,#86A444 70%,#7C9A40 86%,#66812F 94%,#4E6724 100%)}
.main .title-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50} /* judul halaman menempel di atas saat digulir */
.title-text{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;white-space:nowrap}
.ico{width:16px;height:16px;flex:none}
.vis{display:flex;align-items:center;gap:5px;font-size:12px} /* jumlah pengunjung (ikon mata) */
.caps{display:flex;gap:2px}
.cap{width:21px;height:21px;padding:0;border:1px solid #fff;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-shadow:none;background:radial-gradient(120% 120% at 85% 90%,#E4977A 0%,#D2552B 45%,#B8391A 100%)}
.cap svg{width:19px;height:19px;display:block}
.cap:hover{filter:brightness(1.12)}
.window-body{background:var(--xp-face);padding:12px}
/* Jendela yang bisa digeser: muncul di atas halaman, digeser lewat judulnya */
#desk{position:fixed;inset:0;z-index:60;pointer-events:none}
.win{position:absolute;display:none;flex-direction:column;pointer-events:auto;width:min(560px,calc(100% - 8px));max-height:calc(100% - 8px)}
.win .window-body{overflow:auto;flex:1}
.win .title-bar{cursor:move;touch-action:none}
.win:not(.act) .title-bar{background:linear-gradient(180deg,#D7E0BB 0%,#B9C795 8%,#AFBE88 50%,#A3B37B 90%,#8E9F66 100%);text-shadow:1px 1px 0 #6D7A4F} /* jendela tidak aktif lebih pucat */
@media (max-width:700px){.win{left:4px!important;top:4px!important;height:calc(100% - 8px)}} /* HP: jendela penuh layar */
@media (max-width:640px){body{padding-left:6px;padding-right:6px}.window-body{padding:8px}}

fieldset{border:1px solid var(--xp-group);border-radius:3px;margin:0 0 12px;padding:10px 12px;min-width:0}
legend{margin-left:6px;padding:0 3px;color:#0046D5;font-size:12px}

/* ===== 3. BANNER (permanen; tinggi mengikuti gambar, tidak dipotong) ===== */
.bn-wrap{position:relative;background:#fff;border:1px solid var(--xp-input-border)}
.bn-view{overflow:hidden;transition:height .3s;touch-action:pan-y}
.bn-track{display:flex;align-items:flex-start;transition:transform .45s}
.sl{flex:0 0 100%;min-width:0;display:block}
.sl img{width:100%;height:auto;display:block}
.sl.bad{min-height:80px;background:#E6E3D2}
a.sl{cursor:pointer}
.bn-ar{position:absolute;top:calc(50% - 18px);width:24px;height:36px;padding:0;border:1px solid #fff;border-radius:3px;background:rgba(78,103,36,.7);color:#fff;font-size:18px;cursor:pointer;z-index:2}
.bn-ar:hover{background:rgba(78,103,36,.9)}
#prev{left:4px}#next{right:4px}
.bn-dots{display:flex;gap:6px;justify-content:center;padding:8px 0 0}
.dot{width:11px;height:11px;padding:0;border:1px solid var(--xp-border);border-radius:3px;background:linear-gradient(180deg,#fff,#D6D0C5);cursor:pointer}
.dot.on{background:var(--xp-select);box-shadow:inset 0 0 0 1px #9DB6D5}
.banner.one .bn-ar,.banner.one .bn-dots{display:none} /* 1 banner saja → tanpa panah/titik */

/* ===== 4. PEMUTAR MEDIA (permanen; rasio kotak mengikuti video, tidak dipotong) ===== */
.stage{width:100%;max-height:60vh;aspect-ratio:16/9;background:#000;border:1px solid var(--xp-input-border)}
.stage video,.stage iframe{width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
#now{margin:6px 0;font-size:12px}
#chips{display:flex;flex-wrap:wrap;gap:6px}
#chips .b{min-height:21px;padding:1px 9px}

/* ===== 5. MENU (kolom per baris diatur COLS di JS; posisi ikon diatur JS) =====
   Jangan isi left/top/width ikon di CSS. Tinggi sel (CH) ada di JS. */
#menu{position:relative}
.di{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;background:none;border:1px solid transparent;border-radius:3px;color:#000;text-align:center;text-decoration:none;cursor:pointer;font:12px/1.2 Tahoma,Verdana,sans-serif;touch-action:pan-y;transition:left .18s,top .18s} /* transition = animasi saat menu lain bergeser */
.di svg{width:44px;height:44px;pointer-events:none}
.di:hover,.di:focus-visible{background:rgba(49,106,197,.12);border-color:#9DB6D5}
.di.drag{background:var(--xp-select);border-color:var(--xp-select);color:#fff;opacity:.9;z-index:4;transition:none}

/* ===== 6. KOMPONEN: tombol XP, panel, artikel, chat ===== */
.b{font-family:Tahoma,sans-serif;font-size:12px;color:#000;min-height:23px;padding:2px 12px;cursor:pointer;border:1px solid var(--xp-border);border-radius:3px;background:linear-gradient(180deg,#FFF 0%,#F4F3EE 40%,#ECEBE6 86%,#D6D0C5 100%)}
.b:hover:not(:active){box-shadow:inset 0 0 0 1px #F8B330,inset 0 0 0 2px #FDD889}
.b:active,.b.on{background:linear-gradient(180deg,#CDCABB 0%,#E3E3DB 8%,#E5E5DE 94%,#F2F2F1 100%);box-shadow:inset 1px 1px 0 #B3AF9C}
.b.on{font-weight:bold}
.btn-primary{font-weight:bold;box-shadow:inset 0 0 0 2px #98B8EA}
.sunk{background:#fff;border:1px solid var(--xp-input-border);padding:8px}
.live{color:#2E7D1E;font-weight:bold}
#abody{margin-top:8px;line-height:1.7;max-height:48vh;overflow:auto}
#abody h2,#abody h3{margin:12px 0 4px}
#abody blockquote{margin:10px 0;padding:8px 12px;border-left:4px solid var(--xp-frame);background:#F3F1E6;font-style:italic}
textarea{width:100%;height:68px;resize:none;padding:4px 6px;font:12px Tahoma,sans-serif;border:1px solid var(--xp-input-border);border-radius:0;background:#fff;outline:none}
textarea:focus{box-shadow:0 0 0 1px #fff,0 0 0 2px #9DB6D5}
.reply-ind{display:none;justify-content:space-between;background:#FFFFE1;border:1px solid #000;padding:3px 6px;margin-bottom:6px}
.reply-ind button{border:0;background:none;cursor:pointer}
#chat-list{max-height:260px;overflow:auto;margin-top:8px;border:1px solid var(--xp-input-border);background:#fff;padding:6px}
.msg{border:1px solid #D6D2C2;background:#fff;padding:6px 8px;margin-bottom:6px;word-break:break-word}
.msg.self{background:#EAF1FB;border-color:#9DB6D5}
.msg.reply{margin-left:18px;border-left:4px solid var(--xp-frame)}
.who{font-size:11px;font-weight:bold;color:#555}
.act2{display:flex;justify-content:space-between;gap:6px;margin-top:5px}
.act2 .b{min-height:20px;padding:0 6px;font-size:12px}
/* Scrollbar bernuansa olive */
::-webkit-scrollbar{width:17px;height:17px}
::-webkit-scrollbar-track{background:#F3F1E6;border-left:1px solid #E6E3D2}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#E3EBC9 0%,#BFD18A 40%,#A6BE67 100%);border:1px solid #fff;border-radius:3px;box-shadow:inset 0 0 0 1px #8DA24D}
::-webkit-scrollbar-button:single-button{display:block;width:17px;height:17px;border:1px solid #fff;border-radius:3px;background:linear-gradient(135deg,#E8EFD0,#B6CB7B);box-shadow:inset 0 0 0 1px #8DA24D}
</style>
</head>
<body>
<!-- ===== KUMPULAN IKON SVG (sprite) =====
  Tambah ikon baru: salin satu <symbol>, ganti id ("i-nama"), lalu pakai di MENU → icon:'i-nama'.
  Ikon tersedia: i-user, i-media, i-note, i-noti, i-chat, i-lib, i-folder, i-hat, i-clip, i-db, i-group, i-eye -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs><g id="pad"><rect x="6" y="6" width="20" height="23" fill="#fff6a8"/><rect x="6" y="6" width="20" height="5" fill="#e0525e"/><path d="M10 16h12M10 20h12M10 24h7" fill="none" stroke="#6b8bd6"/><path d="M9.5 3v6M14 3v6M18.5 3v6M23 3v6" fill="none" stroke-width="2.4" stroke-linecap="round"/></g></defs>
<symbol id="i-user" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><circle cx="16" cy="10" r="6" fill="#ffd58a"/><path d="M4 29c0-8 5-12 12-12s12 4 12 12z" fill="#3a7bd5"/></symbol>
<symbol id="i-media" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="26" height="18" rx="1" fill="#c0c0c0"/><rect x="5.5" y="6.5" width="21" height="13" fill="#0a2a6b"/><path d="M13 9.5l8 3.5-8 3.5z" fill="#ffe14d"/><path d="M13 22h6v3h4v4H9v-4h4z" fill="#c0c0c0"/></symbol>
<symbol id="i-note" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><use href="#pad"/></symbol>
<symbol id="i-noti" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><use href="#pad"/><circle cx="23" cy="24" r="6.5" fill="#2a7de1"/><path d="M23 20.5v.2M23 23.3v4.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="i-chat" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><path d="M3 5h26v17H14l-7 6v-6H3z" fill="#ffe14d"/><path d="M8 11h16M8 15h10" fill="none"/></symbol>
<symbol id="i-lib" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="26" width="26" height="3" fill="#8a5a2b"/><rect x="5" y="8" width="5" height="18" fill="#d9453d"/><rect x="11" y="5" width="5" height="21" fill="#3a7bd5"/><rect x="17" y="9" width="5" height="17" fill="#3fa34d"/><rect x="23" y="7" width="5" height="19" fill="#f5c542"/><path d="M5 12h5M11 10h5M17 13h5M23 12h5" fill="none"/></symbol>
<symbol id="i-folder" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><path d="M3 8h9l3 3h14v16H3z" fill="#f5c542"/><path d="M3 14h26" fill="none"/></symbol>
<symbol id="i-hat" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><path d="M5 22a11 11 0 0122 0z" fill="#ffd21f"/><rect x="3" y="22" width="26" height="4" fill="#ffd21f"/><path d="M14 11v11M18 11v11" fill="none"/></symbol>
<symbol id="i-clip" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="6" width="22" height="23" fill="#fff"/><rect x="11" y="3" width="10" height="6" fill="#999"/><path d="M9 15l3 3 5-6" fill="none" stroke="#1a8a2e" stroke-width="2"/><path d="M9 24h14" fill="none"/></symbol>
<symbol id="i-db" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><path d="M5 8v16c0 3 5 5 11 5s11-2 11-5V8z" fill="#6aa7e0"/><ellipse cx="16" cy="8" rx="11" ry="4" fill="#a9d1f5"/><path d="M5 16c0 3 5 5 11 5s11-2 11-5" fill="none"/></symbol>
<symbol id="i-group" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><circle cx="11" cy="11" r="5" fill="#ffd58a"/><path d="M2 28c0-7 4-10 9-10s9 3 9 10z" fill="#e0525e"/><circle cx="22" cy="10" r="4.5" fill="#ffd58a"/><path d="M17 20c1-1.5 3-2 5-2 5 0 8 3 8 10h-9" fill="#3fa34d"/></symbol>
<symbol id="i-eye" viewBox="0 0 32 32" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><path d="M2 16c4-7 9-10 14-10s10 3 14 10c-4 7-9 10-14 10S6 23 2 16z" fill="#fff"/><circle cx="16" cy="16" r="5.5" fill="#2a7de1"/><circle cx="16" cy="16" r="2.3" fill="#000"/></symbol>
</svg>

<!-- ===== HALAMAN UTAMA (jendela XP): Judul+pengunjung → Banner → Pemutar Media → Menu =====
  Susunan dari atas ke bawah; semua isinya dibuat JS dari daftar di "1. KONFIGURASI". -->
<div class="window main">

  <!-- JUDUL: nama + jumlah pengunjung (ikon mata; angka diisi Firebase di bagian paling bawah) -->
  <div class="title-bar" id="top"><span class="title-text"><svg class="ico"><use href="#i-user"/></svg> Rana Arifin - Dashboard</span><span class="vis" title="Total pengunjung"><svg class="ico"><use href="#i-eye"/></svg><b id="viewers-count">…</b></span></div>

  <div class="window-body">

    <!-- 1) BANNER INFORMASI (permanen, bergulir otomatis). Slide, titik, dan panah dibuat JS dari BANNERS.
         Banner yang punya href bisa diklik (tautan ala e-commerce). -->
    <fieldset class="banner" id="banner">
      <legend>Informasi</legend>
      <div class="bn-wrap">
        <div class="bn-view" id="bn-view"><div class="bn-track" id="bn-track"></div></div>
        <button class="bn-ar" id="prev" aria-label="Sebelumnya">‹</button>
        <button class="bn-ar" id="next" aria-label="Berikutnya">›</button>
      </div>
      <div class="bn-dots" id="bn-dots"></div>
    </fieldset>

    <!-- 2) PEMUTAR MEDIA (permanen, tepat di bawah banner). Tombol pilihan diisi JS dari MEDIA;
         rasio kotak mengikuti video asli. -->
    <fieldset id="media">
      <legend>Pemutar Media</legend>
      <div class="stage" id="stage"><video id="vid" controls playsinline preload="metadata"></video><iframe id="yt" hidden title="Video YouTube" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
      <div id="now">Sedang diputar: <b id="now-t"></b></div>
      <div id="chips"></div>
    </fieldset>

    <!-- 3) MENU (di bawah pemutar video; ikon dibuat JS dari MENU, COLS per baris) -->
    <fieldset style="margin-bottom:0">
      <legend>Menu</legend>
      <nav id="menu" aria-label="Menu utama"></nav>
    </fieldset>

  </div>
</div>

<!-- ===== LAPISAN JENDELA =====
  Jendela dibuka lewat menu {open:'id-jendela'}. Untuk jendela baru: salin blok,
  ganti id (awali "w-"), judul, ikon, dan isi .window-body -->
<div id="desk">

<!-- JENDELA ARTIKEL — tombol judul diisi JS dari ARTICLES -->
<section class="win" id="w-artikel" aria-label="Artikel">
  <div class="title-bar"><span class="title-text"><svg class="ico"><use href="#i-note"/></svg> Artikel</span><div class="caps"><button type="button" class="cap close" aria-label="Tutup"><svg viewBox="0 0 21 21"><path d="M5.5 5.5L14.5 14.5M14.5 5.5L5.5 14.5" stroke="#fff" stroke-width="2.4" fill="none"/></svg></button></div></div>
  <div class="window-body">
    <div id="art-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="sunk" id="abody">Pilih artikel</div>
  </div>
</section>

<!-- JENDELA INTERAKSI — chat anonim (logika Firebase ada di <script type="module"> paling bawah) -->
<section class="win" id="w-chat" aria-label="Interaksi anonim">
  <div class="title-bar"><span class="title-text"><svg class="ico"><use href="#i-chat"/></svg> Interaksi anonim</span><div class="caps"><button type="button" class="cap close" aria-label="Tutup"><svg viewBox="0 0 21 21"><path d="M5.5 5.5L14.5 14.5M14.5 5.5L5.5 14.5" stroke="#fff" stroke-width="2.4" fill="none"/></svg></button></div></div>
  <div class="window-body">
    <div><b id="user-identity"></b> · komentar anonim: <b id="msg-count">0</b></div>
    <div class="reply-ind" id="reply-indicator"><span id="reply-text">Membalas…</span><button id="cancel-reply" aria-label="Batalkan balasan">✕</button></div>
    <textarea id="chat-input" placeholder="Tulis pesan…"></textarea>
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><button class="b btn-primary" id="send-chat-btn">Kirim pesan</button><span id="send-status" class="live" style="display:none">Pesan terkirim</span></div>
    <div id="chat-list"><div class="msg">Memuat pesan…</div></div>
  </div>
</section>
</div>

<!-- ===== ISI ARTIKEL =====
  Tambah artikel: (1) salin satu <template id="a3">…</template> dan isi teksnya (boleh HTML: <p>, <h3>, <blockquote>),
  (2) daftarkan di ARTICLES pada script: {id:'a3', title:'Judul'} -->
<template id="a1">Realitas adalah hamparan kanvas luas yang dilukis dengan perpaduan tinta air mata dan tawa, sebuah panggung sunyi tempat cahaya dan bayangan senantiasa menari dalam ritme yang tak tertebak.<br><br>Di atas panggung ini, sifat manusia tergelar dalam spektrum yang utuh. Kita sering kali menyaksikan pekatnya keserakahan yang mengikis nurani, rasa dengki yang meracuni akar persaudaraan, hingga pengkhianatan yang dengan mudah mematahkan rantai kepercayaan. Manusia bisa menjadi serigala bagi sesamanya, memburu apa saja demi memuaskan dahaga kekuasaan.<br><br>Namun, di sela-sela kelamnya kegelapan itu, mekar pula rona-rona kebaikan yang paling benderang. Ada ketulusan hati yang sudi berkorban tanpa mengharap balas, belas kasih yang diam-diam merangkul mereka yang terperosok jatuh, serta cinta tanpa pamrih yang mampu menghangatkan jiwa-jiwa yang kedinginan. Kita adalah harmoni yang paradoks; perpaduan antara rapuhnya malaikat dan kelamnya iblis, berjalan beriringan dalam satu wujud fana.<br><br>Meski begitu, gelombang lautan tak selalu ramah pada mereka yang hanya mengandalkan kelembutan. Terkadang, badai menuntut ketegasan yang menyakitkan. <b>Dengan keadaan seperti ini, kadang kita harus sedikit ego dan tidak berperasaan untuk terus bertahan di dunia yang kejam ini. Itulah dunia dan itulah realitas.</b><br><br>Membangun benteng pelindung dan menebalkan dinding hati bukanlah pertanda bahwa kita telah kehilangan kemanusiaan, melainkan sebuah cara jiwa merangkai tamengnya. Kita belajar melangkah di antara sisi terang dan gelap, menyadari seutuhnya bahwa untuk melindungi sisa kebaikan di dalam dada, terkadang kita harus menatap tajamnya kenyataan dengan mata yang tak kalah tajam.</template>
<template id="a2"><h2 style="margin-top:0">Bayang-Bayang Obsesi di Tengah Tuntutan Sosial</h2><p>Layar gawai dan etalase kehidupan orang lain sering kali memancarkan ilusi yang menyilaukan. Di tengah masyarakat modern yang serba cepat, nilai seseorang kerap kali direduksi menjadi seberapa besar pencapaian material yang bisa mereka pamerkan. Dari sinilah lahir sebuah fenomena sosial yang menggerogoti dari dalam: gengsi yang bermutasi menjadi obsesi.</p><h3>Analisis Masalah: Keterasingan Diri dan Hancurnya Batasan</h3><p>Tuntutan untuk terlihat sukses dan mapan menciptakan tekanan psikologis yang luar biasa. Ketika gengsi mengambil alih, standar kebahagiaan tidak lagi ditentukan oleh diri sendiri, melainkan oleh pandangan orang lain.</p><h3>Persiapan untuk Besok</h3><p>Malam ini adalah batas waktu sebelum roda tuntutan kembali berputar esok hari. Agar tidak terus terseret dalam pusaran obsesi yang merusak, persiapan yang dibutuhkan bukanlah strategi untuk berlari lebih cepat, melainkan keberanian untuk berhenti sejenak.</p><blockquote>Kesuksesan sejati tidak diukur dari seberapa riuh tepuk tangan orang lain, melainkan dari seberapa damai kau bisa menatap pantulan dirimu sendiri di cermin.</blockquote><p>Esok adalah lembaran yang baru. Jangan biarkan gengsi mendikte setiap keputusanmu, dan jangan biarkan obsesi merampas kewarasan serta nuranimu.</p></template>

<script>
/* ===================================================================
   1. KONFIGURASI — bagian yang paling sering diedit
   =================================================================== */

/* COLS: jumlah menu per baris. LINK_TAB_BARU: tautan banner dibuka di tab baru (true/false). */
const COLS=3;
const LINK_TAB_BARU=true;

/* BANNERS: banner di bawah header (bergulir otomatis, permanen).
     src  : nama file gambar (taruh di folder yang sama)
     href : (opsional) tautan tujuan bila banner diklik — seperti banner e-commerce
     alt  : (opsional) deskripsi gambar
   Tinggi banner menyesuaikan tiap gambar otomatis (tidak dipotong).
   Contoh menambah banner berlink:
     {src:'promo-diskon.jpg', href:'https://tokoku.com/produk/123', alt:'Diskon 50%'},
   Contoh banner informasi biasa (tanpa link):
     {src:'banner7.png'}, */
const BANNERS=[
  {src:'banner1.jpeg'},
  {src:'banner2.png'},
  {src:'banner3.png'},
  {src:'banner4.png'},
  {src:'banner5.png', href:'https://vercel.com/rana-arifin-s-projects', alt:'Promo'},
  {src:'banner6.png'}
];

/* SLIDE_MS: jeda ganti banner otomatis (milidetik). Isi 0 untuk mematikan. */
const SLIDE_MS=4000;

/* MEDIA: pilihan di pemutar media (tepat di bawah banner). Item pertama = default.
     t   : judul tombol
     src : file video/audio (.mp4/.mp3) ATAU tautan YouTube (video biasa, youtu.be, atau /live/)
   Contoh menambah media:  {t:'Video Baru', src:'video-baru.mp4'}, */
const MEDIA=[
  {t:'Default',        src:'opening.mp4'},
  {t:'Trial.muv',      src:'iklan.mp4'},
  {t:'#81 🇮🇩',         src:'hutri.mp4'},
  {t:'Info',      src:'iklan.mp3'},
  {t:'Trial.YTM-PI7U', src:'https://youtu.be/b-QHj32B4SQ?si=e0y5lG8PqKFBIvMu'},
  {t:'● Live',         src:'https://www.youtube.com/live/PDDOkUq33Sw?si=rah16KaUo2trL9Mp'}
];

/* MENU: ikon di bawah pemutar media, COLS per baris. Urutan awal = urutan di bawah;
   pengunjung bisa menggesernya (menu lain ikut bergeser) dan urutannya disimpan di browser.
   Di HP: tekan-tahan ikon sebentar lalu geser.
     id    : kode unik — jangan sama dengan menu lain
     label : teks di bawah ikon
     icon  : id <symbol> dari kumpulan ikon SVG di atas halaman
     href  : tautan halaman   — ATAU —
     open  : id jendela yang dibuka (mis. 'w-chat')
     title : (opsional) tooltip
   Contoh menambah menu:  {id:'x1', label:'Galeri', icon:'i-folder', href:'galeri.html'}, */
const MENU=[
  {id:'p',  label:'Profil',                 icon:'i-user',   href:'dashboard.html'},
  {id:'a',  label:'Artikel',                icon:'i-note',   open:'w-artikel'},
  {id:'c',  label:'Interaksi',              icon:'i-chat',   open:'w-chat'},
  {id:'l',  label:'Library',                icon:'i-lib',    href:'library.html'},
  {id:'as', label:'The Assembly',           icon:'i-folder', href:'dokumen.html'},
  {id:'pp', label:'PPBO (Construction)',    icon:'i-hat',    href:'https://app.arinex.my.id'},
  {id:'s',  label:'Survey Evaluasi',        icon:'i-clip',   href:'learn.html', title:'Dapat voucher'},
  {id:'db', label:'Dokumentasi PostgreSQL', icon:'i-db',     href:'https://dokumentasi.arinex.my.id/dokumentasi_fnb_db.html'},
  {id:'g',  label:'Grup Chat',              icon:'i-group',  href:'https://chat-indol-xi.vercel.app/'}
];

/* ARTICLES: daftar di jendela Artikel. id harus sama dengan <template id="..."> di bawah halaman. */
const ARTICLES=[
  {id:'a1', title:'Behavioral Approach'},
  {id:'a2', title:'Sebelum Esok'}
];

/* ===================================================================
   2. UTILITAS UMUM
   =================================================================== */
const $=id=>document.getElementById(id);
const D=$('desk'),vid=$('vid'),yt=$('yt'),stage=$('stage');
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch{return{}}}; // baca pengaturan tersimpan
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};           // simpan pengaturan

/* Letakkan elemen di (x,y) dan jaga agar tetap di dalam induknya (menu / lapisan jendela) */
const put=(el,x,y)=>{
  const P=el.offsetParent||D;
  el.style.left=Math.max(0,Math.min(x,P.clientWidth-el.offsetWidth))+'px';
  el.style.top=Math.max(0,Math.min(y,P.clientHeight-el.offsetHeight))+'px';
};

/* Penggeser serba guna (mouse & sentuh).
   el=elemen yang bergerak, h=bagian yang ditarik, ok(e)=boleh mulai tarik?,
   onMove(el)=dipanggil saat bergerak, onEnd(el)=dipanggil saat dilepas,
   hold=(opsional) lama tekan-tahan di layar sentuh sebelum bisa digeser (ms) — agar halaman tetap bisa digulir */
function mv(el,h,ok,onMove,onEnd,hold){
  let s,go,tm,armed=false;
  h.addEventListener('pointerdown',e=>{
    if(e.button||!ok(e))return;
    s=[e.clientX,e.clientY,el.offsetLeft,el.offsetTop];go=false;
    armed=!(hold&&e.pointerType==='touch');
    if(!armed)tm=setTimeout(()=>{armed=true;el.classList.add('drag')},hold);
    try{h.setPointerCapture(e.pointerId)}catch{}
  });
  h.addEventListener('pointermove',e=>{
    if(!s)return;
    const dx=e.clientX-s[0],dy=e.clientY-s[1],d=Math.hypot(dx,dy);
    if(!armed){if(d>8){clearTimeout(tm);s=null}return} // bergerak sebelum tahan → biarkan halaman menggulir
    if(!go&&d<6)return;                                  // abaikan getaran kecil (klik biasa tetap jalan)
    go=true;el.classList.add('drag');put(el,s[2]+dx,s[3]+dy);onMove&&onMove(el);
  });
  const up=()=>{clearTimeout(tm);if(!s)return;s=null;armed=false;el.classList.remove('drag');if(go){h._t=Date.now();onEnd&&onEnd(el)}};
  h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  h.addEventListener('touchmove',e=>{if(armed&&e.cancelable)e.preventDefault()},{passive:false}); // saat menggeser, jangan gulir halaman
}

/* ===================================================================
   3. PROTEKSI TAMPILAN — teks tidak bisa disalin & klik kanan diblokir
   (hanya penghalang dasar). Hapus blok ini untuk menonaktifkan.
   =================================================================== */
const inTA=()=>document.activeElement&&document.activeElement.tagName==='TEXTAREA';
addEventListener('contextmenu',e=>e.preventDefault());
['copy','cut'].forEach(t=>addEventListener(t,e=>{if(!inTA())e.preventDefault()}));
addEventListener('selectstart',e=>{if(!(e.target.closest&&e.target.closest('textarea')))e.preventDefault()});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&'acus'.includes(e.key.toLowerCase())&&!inTA())e.preventDefault()});

/* ===================================================================
   4. BANNER INFORMASI — dari BANNERS; bergulir otomatis; tinggi mengikuti gambar
   =================================================================== */
const BV=$('bn-view'),BT=$('bn-track'),BD=$('bn-dots');
let bi=0,bTimer,bSw=0;
$('banner').hidden=!BANNERS.length;
$('banner').classList.toggle('one',BANNERS.length<2);
BANNERS.forEach((b,i)=>{
  const s=document.createElement(b.href?'a':'div');  // ada href → slide jadi tautan
  s.className='sl';
  if(b.href){s.href=b.href;s.draggable=false;if(LINK_TAB_BARU){s.target='_blank';s.rel='noopener noreferrer'}}
  const m=document.createElement('img');
  m.src=b.src;m.alt=b.alt||'Informasi '+(i+1);m.draggable=false;
  m.onload=bnFit;                                   // gambar selesai dimuat → sesuaikan tinggi
  m.onerror=()=>{s.classList.add('bad');bnFit()};   // file tidak ada → kotak abu-abu kecil
  s.append(m);BT.append(s);
  const d=document.createElement('button');         // titik navigasi
  d.className='dot';d.setAttribute('aria-label','Banner '+(i+1));
  d.onclick=()=>{bnGo(i);bnAuto()};BD.append(d);
});
function bnFit(){const s=BT.children[bi];if(s)BV.style.height=s.clientHeight+'px'} // tinggi = tinggi slide aktif
function bnGo(i){
  bi=(i+BANNERS.length)%BANNERS.length;
  BT.style.transform='translateX('+(-bi*100)+'%)';
  [...BD.children].forEach((d,k)=>d.classList.toggle('on',k===bi));
  bnFit();
}
function bnAuto(){ // gulir otomatis (berhenti sementara saat disorot kursor)
  clearInterval(bTimer);
  if(BANNERS.length>1&&SLIDE_MS)bTimer=setInterval(()=>{if(BV.offsetWidth&&!BV.matches(':hover'))bnGo(bi+1)},SLIDE_MS);
}
new ResizeObserver(bnFit).observe(BV); // layar diubah ukurannya → hitung ulang tinggi
$('prev').onclick=()=>{bnGo(bi-1);bnAuto()};
$('next').onclick=()=>{bnGo(bi+1);bnAuto()};
let sx=null; // geser (swipe) di layar sentuh
BV.addEventListener('pointerdown',e=>sx=e.clientX);
BV.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>40){bSw=Date.now();bnGo(bi+(e.clientX<sx?1:-1));bnAuto()}sx=null});
BV.addEventListener('click',e=>{if(Date.now()-bSw<350)e.preventDefault()},true); // habis swipe jangan ikut membuka link
bnGo(0);bnAuto();

/* ===================================================================
   5. PEMUTAR MEDIA — isi dari MEDIA; tinggi kotak mengikuti rasio video
   =================================================================== */
const chips=MEDIA.map((m,i)=>{
  const b=document.createElement('button');
  b.className='b'+(i?'':' on');b.textContent=m.t;b.onclick=()=>playMedia(m,b);
  $('chips').append(b);return b;
});
function playMedia(m,b){
  chips.forEach(x=>x.classList.toggle('on',x===b));$('now-t').textContent=m.t;
  const id=(m.src.match(/(?:v=|youtu\.be\/|\/live\/)([\w-]{11})/)||[])[1]; // ID YouTube (jika tautan YouTube)
  if(id){ // YouTube → iframe, rasio 16:9
    vid.pause();vid.hidden=true;yt.hidden=false;stage.style.aspectRatio='16/9';
    yt.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1';
  }else{  // file video/audio → <video>
    yt.hidden=true;yt.src='about:blank';vid.hidden=false;vid.src=m.src;vid.play().catch(()=>{});
  }
}
// begitu video siap, samakan rasio kotak dengan rasio video asli → tidak terpotong
vid.addEventListener('loadedmetadata',()=>{stage.style.aspectRatio=vid.videoWidth?vid.videoWidth+'/'+vid.videoHeight:'16/9'});
if(MEDIA.length){vid.src=MEDIA[0].src;$('now-t').textContent=MEDIA[0].t}

/* ===================================================================
   6. MENU (IKON) — dibuat dari MENU, COLS per baris, bisa digeser & menu lain ikut bergeser
   =================================================================== */
const CH=92;            // tinggi satu baris menu (px)
const M=$('menu'),byId={};

MENU.forEach(m=>{
  const el=document.createElement(m.href?'a':'button');
  el.className='di';el.dataset.id=m.id;
  if(m.href){el.href=m.href;el.draggable=false}
  if(m.title)el.title=m.title;
  el.innerHTML='<svg><use href="#'+m.icon+'"/></svg>'+m.label;
  M.append(el);byId[m.id]=el;

  // tarik untuk memindahkan (di layar sentuh: tekan-tahan 300 ms dulu) → menu lain bergeser
  mv(el,el,()=>true,iconMove,iconEnd,300);
  // setelah ditarik, cegah "klik" yang ikut terpicu (supaya tautan tidak terbuka)
  el.addEventListener('click',e=>{if(Date.now()-(el._t||0)<350){e.preventDefault();e.stopImmediatePropagation()}},true);
  if(m.open)el.addEventListener('click',()=>openW(m.open));
});

/* Urutan ikon: dari browser (jika ada) + menu baru yang belum tersimpan */
const savedOrder=load('menu_order');
const order=(Array.isArray(savedOrder)?savedOrder:[]).filter(id=>byId[id]);
MENU.forEach(m=>{if(!order.includes(m.id))order.push(m.id)});

/* Tempatkan semua ikon sesuai urutan, COLS per baris (skip = ikon yang sedang ditarik) */
function layout(skip){
  const cw=M.clientWidth/COLS;
  M.style.height=Math.ceil(order.length/COLS)*CH+'px';
  order.forEach((id,k)=>{
    const el=byId[id];el.style.width=(cw-8)+'px';
    if(el===skip)return;
    el.style.left=(k%COLS*cw+4)+'px';el.style.top=Math.floor(k/COLS)*CH+'px';
  });
}
/* Saat ikon ditarik: cari sel terdekat, sisipkan di sana, ikon lain bergeser */
function iconMove(el){
  const cw=M.clientWidth/COLS,rowsN=Math.ceil(order.length/COLS);
  const c=Math.max(0,Math.min(COLS-1,Math.floor((el.offsetLeft+el.offsetWidth/2)/cw)));
  const r=Math.max(0,Math.min(rowsN-1,Math.floor((el.offsetTop+el.offsetHeight/2)/CH)));
  const to=Math.min(order.length-1,r*COLS+c),from=order.indexOf(el.dataset.id);
  if(to!==from){order.splice(from,1);order.splice(to,0,el.dataset.id);layout(el)}
}
/* Saat dilepas: ikon masuk ke selnya & urutan disimpan */
function iconEnd(){layout();save('menu_order',order)}
layout();
addEventListener('resize',()=>layout());
addEventListener('load',()=>layout());

/* ===================================================================
   7. JENDELA (.win) — dibuka dari menu {open:'id'}, bisa digeser lewat judul
   =================================================================== */
const W=[...document.querySelectorAll('.win')];
let z=10,n=0;
const front=w=>{w.style.zIndex=++z;W.forEach(x=>x.classList.toggle('act',x===w))};
function openW(id){
  const w=$(id);
  if(!w.dataset.p){w.dataset.p=1;if(innerWidth>700){w.style.left=30+n%6*30+'px';w.style.top=56+n%6*30+'px'}n++} // posisi bertingkat
  w.style.display='flex';front(w);
}
const closeW=w=>{w.style.display='none';delete w.dataset.p};
W.forEach(w=>{
  w.querySelector('.close').onclick=()=>closeW(w);
  w.addEventListener('pointerdown',()=>front(w));
  mv(w,w.querySelector('.title-bar'),e=>innerWidth>700&&!e.target.closest('button'));
});

/* ===================================================================
   8. JENDELA ARTIKEL — tombol dari ARTICLES, isi dari <template id="..."> di bawah
   =================================================================== */
ARTICLES.forEach(a=>{
  const b=document.createElement('button');
  b.className='b';b.textContent=a.title;
  b.onclick=()=>{[...$('art-btns').children].forEach(x=>x.classList.toggle('on',x===b));$('abody').innerHTML=$(a.id).innerHTML};
  $('art-btns').append(b);
});
</script>

<script type="module">
/* ===== 9. FIREBASE — jumlah pengunjung (header) & chat anonim =====
   • Pengunjung : dihitung 1x per browser, ditulis ke statistik_web/total_viewers
   • Chat       : pesan di pesan_anonim (balasan memakai parentId, reaksi wow/super/haha)
   Ganti konfigurasi Firebase di initializeApp({...}) bila memakai proyek lain. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, push, onValue, serverTimestamp, update, increment } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAxf2w0makvkXAD1zBMSJyV4ZD0f05FvDc",
  authDomain: "profil-db4e9.firebaseapp.com",
  databaseURL: "https://profil-db4e9-default-rtdb.firebaseio.com",
  projectId: "profil-db4e9",
  storageBucket: "profil-db4e9.firebasestorage.app",
  messagingSenderId: "897423797460",
  appId: "1:897423797460:web:88b1ef8537397c023d1f41",
  measurementId: "G-G1Y4QE8J06"
});
const db = getDatabase(app), $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

/* ID anonim */
let uid = store.get('arinex_anon_id');
if (!uid) { uid = 'ID-' + Math.random().toString(36).substring(2, 7).toUpperCase(); store.set('arinex_anon_id', uid); }
$('user-identity').textContent = 'Kamu: ' + uid;

/* Pengunjung */
if (!store.get('arinex_has_viewed')) {
  update(ref(db, 'statistik_web'), { total_viewers: increment(1) })
    .then(() => store.set('arinex_has_viewed', 'true'))
    .catch(e => console.error('Gagal mencatat viewer:', e));
}
onValue(ref(db, 'statistik_web/total_viewers'), s => {
  if (s.exists()) $('viewers-count').textContent = Number(s.val()).toLocaleString('id-ID');
});

/* Chat */
const chatRef = ref(db, 'pesan_anonim'), input = $('chat-input'), btn = $('send-chat-btn'), list = $('chat-list'), ind = $('reply-indicator');
let parentId = null;
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const resetReply = () => { parentId = null; ind.style.display = 'none'; input.placeholder = 'Tulis pesan…'; };
$('cancel-reply').onclick = resetReply;

btn.onclick = () => {
  const teks = input.value.trim();
  if (!teks) return;
  btn.textContent = 'Mengirim…'; btn.disabled = true;
  push(chatRef, { userId: uid, teks, waktu: serverTimestamp(), parentId, reactions: { wow: 0, super: 0, haha: 0 } })
    .then(() => {
      input.value = '';
      $('send-status').style.display = 'inline';
      setTimeout(() => $('send-status').style.display = 'none', 3000);
      resetReply();
    })
    .catch(e => { console.error(e); alert('Gagal mengirim pesan. Coba lagi.'); })
    .finally(() => { btn.textContent = 'Kirim pesan'; btn.disabled = false; });
};

function msgDOM(m, isReply) {
  const self = m.userId === uid, r = m.reactions || {}, el = document.createElement('div');
  el.className = 'msg' + (isReply ? ' reply' : '') + (self ? ' self' : '');
  el.innerHTML = `<div class="who">${self ? 'Kamu' : esc(m.userId)}</div><div>${esc(m.teks)}</div>
    <div class="act2"><span>
      <button class="b" data-t="wow">😮 ${r.wow || 0}</button>
      <button class="b" data-t="super">❤️ ${r.super || 0}</button>
      <button class="b" data-t="haha">😂 ${r.haha || 0}</button></span>
      ${isReply ? '' : '<button class="b rp">Balas</button>'}</div>`;
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () =>
    update(ref(db, `pesan_anonim/${m.id}/reactions`), { [b.dataset.t]: increment(1) }));
  const rp = el.querySelector('.rp');
  if (rp) rp.onclick = () => {
    parentId = m.id; ind.style.display = 'flex';
    $('reply-text').textContent = 'Membalas ' + (self ? 'pesanmu sendiri' : m.userId);
    input.placeholder = 'Tulis balasan…'; input.focus();
  };
  return el;
}

onValue(chatRef, snap => {
  list.innerHTML = '';
  if (!snap.exists()) {
    $('msg-count').textContent = '0';
    list.innerHTML = '<div class="msg">Belum ada obrolan. Jadilah yang pertama menulis pesan.</div>';
    return;
  }
  const data = snap.val(), main = [], replies = {};
  Object.keys(data).forEach(k => {
    const m = { id: k, ...data[k] };
    if (!m.parentId) main.push(m); else (replies[m.parentId] ||= []).push(m);
  });
  $('msg-count').textContent = Object.keys(data).length.toLocaleString('id-ID');
  main.reverse().forEach(m => {
    list.appendChild(msgDOM(m, false));
    (replies[m.id] || []).forEach(r => list.appendChild(msgDOM(r, true)));
  });
});
</script>
</body>
</html>
