<!--
=====================================================================
 PANDUAN UPDATE CEPAT
 Hampir semua konten diatur di bagian "1. KONFIGURASI" pada <script>.
---------------------------------------------------------------------
 • Tambah MEDIA     → tambah satu baris di MEDIA   { t:'Judul', src:'file.mp4' }
                      (src boleh .mp4 / .mp3 / tautan YouTube biasa, youtu.be, atau /live/)
 • Tambah INFORMASI → taruh gambar di folder yang sama, lalu tambah baris di BANNERS { src:'banner7.png' }
 • Tambah MENU      → tambah baris di MENU (id harus unik). Pakai href:'...' untuk tautan,
                      atau open:'id-jendela' untuk membuka jendela
 • Tambah ARTIKEL   → tambah <template id="a3"> berisi teks, lalu daftarkan di ARTICLES
 • Tambah WIDGET    → salin satu blok <aside class="widget" data-wid="..."> (data-wid unik)
 • Tambah JENDELA   → salin blok <section class="win" id="w-..."> lalu buat menu open:'w-...'
 • Reset tata letak → hapus data situs di browser (localStorage: menu_order, wg_media, wg_info)
=====================================================================
-->
<style>
/* ===== 1. DASAR & TEMA =====
   Warna latar desktop (hijau tosca) diatur di body{background}. */
:root{--face:#c0c0c0;--hi:#fff;--sh:#808080;--dk:#404040}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#008080;color:#000;font:13px/1.45 Tahoma,Verdana,Geneva,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} /* teks tidak bisa diseleksi */
textarea{-webkit-user-select:text;user-select:text} /* kolom ketik chat tetap bisa dipakai */
img,a{-webkit-user-drag:none}
button,a{font:inherit;color:inherit}
:focus-visible{outline:1px dotted #fff;outline-offset:1px}

/* ===== 2. HEADER (nama + jumlah pengunjung) ===== */
#top{position:fixed;inset:0 0 auto 0;height:calc(38px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;justify-content:space-between;background:#006666;border-bottom:2px solid #00b3b3;color:#fff;font-size:15px;text-shadow:1px 1px 0 #000;z-index:50}
.vis{display:flex;align-items:center;gap:6px}
.vis svg{width:22px;height:22px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5))}

/* ===== 3. DESKTOP & IKON MENU =====
   Posisi ikon diatur JS (kisi + geser untuk mengurutkan). Jangan isi left/top di sini.
   Ukuran sel kisi (100x104) ada di JS: CW, CH. */
.desk{position:fixed;inset:calc(38px + env(safe-area-inset-top,0px)) 0 env(safe-area-inset-bottom,0px) 0}
.icons{position:absolute;inset:0}
.di{position:absolute;left:0;top:0;width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;background:none;border:1px dotted transparent;color:#fff;text-align:center;text-decoration:none;text-shadow:1px 1px 0 #000;cursor:pointer;font-size:12px;line-height:1.2;touch-action:none;transition:left .18s,top .18s} /* transition = animasi saat menu lain bergeser */
.di svg{width:40px;height:40px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.45));pointer-events:none}
.di:hover,.di:focus-visible,.di.drag{background:rgba(0,70,70,.6);border-color:#fff}
.di.drag{opacity:.85;z-index:4;transition:none}

/* ===== 4. JENDELA (.win) & WIDGET (.widget) — gaya dasar bersama ===== */
.win,.widget{position:absolute;flex-direction:column;width:min(560px,calc(100% - 8px));max-height:calc(100% - 8px);background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);box-shadow:1px 1px 0 #000;padding:2px}
.win{display:none} /* jendela tersembunyi sampai dibuka lewat menu */
.widget{display:flex;z-index:5;width:min(340px,calc(100% - 8px));min-width:240px;max-width:calc(100% - 8px);overflow:hidden;resize:horizontal} /* resize = tarik pojok kanan bawah untuk melebarkan */
.widget.min{resize:none}
.widget.min .wb{display:none} /* ciut: hanya judul */
.widget .wb{padding:6px}
.tbar{display:flex;align-items:center;gap:6px;padding:3px 4px;background:linear-gradient(90deg,#005f5f,#22a8a8);color:#fff;font-weight:700;cursor:move;touch-action:none}
.win:not(.act) .tbar{background:linear-gradient(90deg,#808080,#b5b5b5)}
.tbar svg{width:16px;height:16px;flex:none}
.tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{padding:8px;overflow:auto;flex:1}
@media (max-width:700px){.win{left:4px!important;top:4px!important;height:calc(100% - 8px)}} /* HP: jendela penuh layar */

/* ===== 5. KOMPONEN ===== */
.b{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);padding:2px 10px;cursor:pointer;color:#000}
.b:active,.b.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk)}
.b.on{background:#dcdcdc;font-weight:700}
.x{width:20px;height:18px;padding:0;line-height:1;font-weight:700}
.sunk{background:#fff;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:8px}
.live{color:#0a7a2a;font-weight:700}
/* Media: tinggi mengikuti rasio video (diatur JS), video tidak dipotong (contain) */
.stage{width:100%;max-height:60vh;aspect-ratio:16/9;background:#000;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.stage video,.stage iframe{width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
#now{margin:6px 0;font-size:12px}
#chips{display:flex;flex-wrap:wrap;gap:5px}
#chips .b{padding:1px 8px;font-size:12px}
/* Banner: tinggi mengikuti gambar yang tampil (diatur JS), gambar utuh tanpa dipotong */
.bn-view{overflow:hidden;background:#000;transition:height .3s;touch-action:pan-y}
.bn-track{display:flex;align-items:flex-start;transition:transform .35s}
.bn-track img{flex:0 0 100%;width:100%;height:auto;display:block}
.bn-track img.bad{min-height:80px;background:#e6e6e6}
.nav2{display:flex;gap:6px;margin-top:6px;align-items:center;justify-content:space-between;font-size:12px}
/* Artikel */
#abody{margin-top:8px;line-height:1.7;max-height:48vh;overflow:auto}
#abody h2,#abody h3{margin:12px 0 4px}
#abody blockquote{margin:10px 0;padding:8px 12px;border-left:4px solid #008080;background:#eef;font-style:italic}
/* Chat */
textarea{width:100%;height:68px;resize:none;padding:6px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);font:inherit}
.reply-ind{display:none;justify-content:space-between;background:#ffffcc;border:1px solid #999;padding:3px 6px;margin-bottom:6px}
.reply-ind button{border:0;background:none;cursor:pointer}
#chat-list{max-height:260px;overflow:auto;margin-top:8px}
.msg{border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:#fff;padding:6px 8px;margin-bottom:6px;word-break:break-word}
.msg.self{background:#ffffcc}
.msg.reply{margin-left:18px;border-left:4px solid #008080}
.who{font-size:11px;font-weight:700;color:#555}
.act2{display:flex;justify-content:space-between;gap:6px;margin-top:5px}
.act2 .b{padding:0 6px;font-size:12px}
</style>
</head>
<body>

<!-- ===== HEADER: nama + jumlah pengunjung (angka diisi Firebase di bagian paling bawah) ===== -->
<header id="top"><b>Rana Arifin</b><span class="vis" title="Total pengunjung"><svg><use href="#i-eye"/></svg><b id="viewers-count">…</b></span></header>

<main class="desk" id="desk">

<!-- ===== MENU: ikon dibuat otomatis oleh JS dari daftar MENU (lihat "1. KONFIGURASI") ===== -->
<nav class="icons" id="menu" aria-label="Menu utama"></nav>

<!-- ===== WIDGET =====
  Semua widget otomatis bisa digeser (tarik judul), dilebarkan (tarik pojok kanan bawah), dan diciutkan (tombol – / +).
  data-wid    : nama unik (dipakai menyimpan posisi di browser)
  data-anchor : posisi awal → tl (kiri atas), tr (kanan atas), bl (kiri bawah), br (kanan bawah)
  Untuk widget baru: salin salah satu blok di bawah, ganti data-wid, judul, dan isi .wb -->

<!-- WIDGET MEDIA — tombol pilihan diisi JS dari MEDIA; rasio layar mengikuti video -->
<aside class="widget" data-wid="media" data-anchor="br" aria-label="Widget media">
  <div class="tbar"><svg><use href="#i-media"/></svg><span class="tt">Media</span><button class="b x" aria-label="Ciutkan widget">–</button></div>

<!-- WIDGET INFORMASI — gambar diisi JS dari BANNERS; tinggi mengikuti gambar -->

  </div>
</aside>

<!-- ===== JENDELA =====
  Jendela dibuka lewat menu {open:'id-jendela'}. Untuk jendela baru: salin blok, ganti id (awali "w-"), judul, dan isi .wb -->

<!-- ===== ISI ARTIKEL =====
  Tambah artikel: (1) salin satu <template id="a3">…</template> dan isi teksnya (boleh HTML: <p>, <h3>, <blockquote>),
  (2) daftarkan di ARTICLES pada script: {id:'a3', title:'Judul'} -->
<template id="a1">Realitas adalah hamparan kanvas luas yang dilukis dengan perpaduan tinta air mata dan tawa, sebuah panggung sunyi tempat cahaya dan bayangan senantiasa menari dalam ritme yang tak tertebak.<br><br>Di atas panggung ini, sifat manusia tergelar dalam spektrum yang utuh. Kita sering kali menyaksikan pekatnya keserakahan yang mengikis nurani, rasa dengki yang meracuni akar persaudaraan, hingga pengkhianatan yang dengan mudah mematahkan rantai kepercayaan. Manusia bisa menjadi serigala bagi sesamanya, memburu apa saja demi memuaskan dahaga kekuasaan.<br><br>Namun, di sela-sela kelamnya kegelapan itu, mekar pula rona-rona kebaikan yang paling benderang. Ada ketulusan hati yang sudi berkorban tanpa mengharap balas, belas kasih yang diam-diam merangkul mereka yang terperosok jatuh, serta cinta tanpa pamrih yang mampu menghangatkan jiwa-jiwa yang kedinginan. Kita adalah harmoni yang paradoks; perpaduan antara rapuhnya malaikat dan kelamnya iblis, berjalan beriringan dalam satu wujud fana.<br><br>Meski begitu, gelombang lautan tak selalu ramah pada mereka yang hanya mengandalkan kelembutan. Terkadang, badai menuntut ketegasan yang menyakitkan. <b>Dengan keadaan seperti ini, kadang kita harus sedikit ego dan tidak berperasaan untuk terus bertahan di dunia yang kejam ini. Itulah dunia dan itulah realitas.</b><br><br>Membangun benteng pelindung dan menebalkan dinding hati bukanlah pertanda bahwa kita telah kehilangan kemanusiaan, melainkan sebuah cara jiwa merangkai tamengnya. Kita belajar melangkah di antara sisi terang dan gelap, menyadari seutuhnya bahwa untuk melindungi sisa kebaikan di dalam dada, terkadang kita harus menatap tajamnya kenyataan dengan mata yang tak kalah tajam.</template>
<template id="a2"><h2 style="margin-top:0">Bayang-Bayang Obsesi di Tengah Tuntutan Sosial</h2><p>Layar gawai dan etalase kehidupan orang lain sering kali memancarkan ilusi yang menyilaukan. Di tengah masyarakat modern yang serba cepat, nilai seseorang kerap kali direduksi menjadi seberapa besar pencapaian material yang bisa mereka pamerkan. Dari sinilah lahir sebuah fenomena sosial yang menggerogoti dari dalam: gengsi yang bermutasi menjadi obsesi.</p><h3>Analisis Masalah: Keterasingan Diri dan Hancurnya Batasan</h3><p>Tuntutan untuk terlihat sukses dan mapan menciptakan tekanan psikologis yang luar biasa. Ketika gengsi mengambil alih, standar kebahagiaan tidak lagi ditentukan oleh diri sendiri, melainkan oleh pandangan orang lain.</p><h3>Persiapan untuk Besok</h3><p>Malam ini adalah batas waktu sebelum roda tuntutan kembali berputar esok hari. Agar tidak terus terseret dalam pusaran obsesi yang merusak, persiapan yang dibutuhkan bukanlah strategi untuk berlari lebih cepat, melainkan keberanian untuk berhenti sejenak.</p><blockquote>Kesuksesan sejati tidak diukur dari seberapa riuh tepuk tangan orang lain, melainkan dari seberapa damai kau bisa menatap pantulan dirimu sendiri di cermin.</blockquote><p>Esok adalah lembaran yang baru. Jangan biarkan gengsi mendikte setiap keputusanmu, dan jangan biarkan obsesi merampas kewarasan serta nuranimu.</p></template>

<script>
/* ===================================================================
   1. KONFIGURASI — bagian yang paling sering diedit
   =================================================================== */

/* MENU: ikon di desktop. Urutan awal = urutan di bawah; pengunjung bisa menggesernya
   (menu lain ikut bergeser) dan urutannya disimpan di browser.
     id    : kode unik — jangan sama dengan menu lain
     label : teks di bawah ikon
     icon  : id <symbol> dari kumpulan ikon SVG di atas halaman
     href  : tautan halaman   — ATAU —
     open  : id jendela yang dibuka (mis. 'w-chat')
     title : (opsional) tooltip
   Contoh menambah menu:  {id:'x1', label:'Galeri', icon:'i-folder', href:'galeri.html'}, */
const MENU=[
  {id:'p',  label:'Profil',                 icon:'i-user',   href:'dashboard.html'},
  {id:'a',  label:'Artikel',                icon:'i-note',   open:'w-artikel'},
  {id:'c',  label:'Interaksi',              icon:'i-chat',   open:'w-chat'},
  {id:'l',  label:'Library',                icon:'i-lib',    href:'library.html'},
  {id:'as', label:'The Assembly',           icon:'i-folder', href:'dokumen.html'},
  {id:'pp', label:'PPBO (Construction)',    icon:'i-hat',    href:'https://app.arinex.my.id'},
  {id:'s',  label:'Survey Evaluasi',        icon:'i-clip',   href:'learn.html', title:'Dapat voucher'},
  {id:'db', label:'Dokumentasi PostgreSQL', icon:'i-db',     href:'https://dokumentasi.arinex.my.id/dokumentasi_fnb_db.html'},
  {id:'g',  label:'Grup Chat',              icon:'i-group',  href:'https://chat-indol-xi.vercel.app/'}
];

/* MEDIA: pilihan di widget Media. Item pertama = default.
     t   : judul tombol
     src : file video/audio (.mp4/.mp3) ATAU tautan YouTube (video biasa, youtu.be, atau /live/)
   Contoh menambah media:  {t:'Video Baru', src:'video-baru.mp4'}, */
const MEDIA=[
  {t:'Default',        src:'020901.mp4'},
  {t:'Trial.muv',      src:'iklan.mp4'},
  {t:'#81 🇮🇩',         src:'hutri.mp4'},
  {t:'September',      src:'020901.mp3'},
  {t:'Trial.YTM-PI7U', src:'https://youtu.be/b-QHj32B4SQ?si=e0y5lG8PqKFBIvMu'},
  {t:'● Live',         src:'https://www.youtube.com/live/pkfcV-OiTk4?feature=shared'}
];

/* BANNERS: gambar di widget Informasi. Tinggi widget menyesuaikan tiap gambar (tidak dipotong).
     src : nama file gambar (taruh di folder yang sama)   alt : (opsional) deskripsi
   Contoh menambah informasi:  {src:'banner7.png', alt:'Pengumuman baru'}, */
const BANNERS=[
  {src:'banner1.jpeg'},{src:'banner2.png'},{src:'banner3.png'},
  {src:'banner4.png'},{src:'banner5.png'},{src:'banner6.png'}
];

/* SLIDE_MS: jeda ganti banner otomatis (milidetik). Isi 0 untuk mematikan. */
const SLIDE_MS=5000;

/* ARTICLES: daftar di jendela Artikel. id harus sama dengan <template id="..."> di bawah halaman. */
const ARTICLES=[
  {id:'a1', title:'Behavioral Approach'},
  {id:'a2', title:'Sebelum Esok'}
];

/* ===================================================================
   2. UTILITAS UMUM
   =================================================================== */
const $=id=>document.getElementById(id);
const D=$('desk'),vid=$('vid'),yt=$('yt'),stage=$('stage');
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch{return{}}}; // baca pengaturan tersimpan
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};           // simpan pengaturan

/* Letakkan elemen di (x,y) dan jaga agar tetap di dalam desktop */
const put=(el,x,y)=>{
  el.style.left=Math.max(0,Math.min(x,D.clientWidth-el.offsetWidth))+'px';
  el.style.top=Math.max(0,Math.min(y,D.clientHeight-el.offsetHeight))+'px';
};

/* Penggeser serba guna (mouse & sentuh).
   el=elemen yang bergerak, h=bagian yang ditarik, ok(e)=boleh mulai tarik?,
   onMove(el)=dipanggil saat bergerak, onEnd(el)=dipanggil saat dilepas */
function mv(el,h,ok,onMove,onEnd){
  let s,go;
  h.addEventListener('pointerdown',e=>{
    if(e.button||!ok(e))return;
    s=[e.clientX,e.clientY,el.offsetLeft,el.offsetTop];go=false;
    try{h.setPointerCapture(e.pointerId)}catch{}
  });
  h.addEventListener('pointermove',e=>{
    if(!s)return;
    const dx=e.clientX-s[0],dy=e.clientY-s[1];
    if(!go&&Math.hypot(dx,dy)<6)return;           // abaikan getaran kecil (agar klik biasa tetap jalan)
    go=true;el.classList.add('drag');put(el,s[2]+dx,s[3]+dy);onMove&&onMove(el);
  });
  const up=()=>{if(!s)return;s=null;el.classList.remove('drag');if(go){h._t=Date.now();onEnd&&onEnd(el)}};
  h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
}

/* ===================================================================
   3. PROTEKSI TAMPILAN — teks tidak bisa disalin & klik kanan diblokir
   (hanya penghalang dasar). Hapus blok ini untuk menonaktifkan.
   =================================================================== */
const inTA=()=>document.activeElement&&document.activeElement.tagName==='TEXTAREA';
addEventListener('contextmenu',e=>e.preventDefault());
['copy','cut'].forEach(t=>addEventListener(t,e=>{if(!inTA())e.preventDefault()}));
addEventListener('selectstart',e=>{if(!(e.target.closest&&e.target.closest('textarea')))e.preventDefault()});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&'acus'.includes(e.key.toLowerCase())&&!inTA())e.preventDefault()});

/* ===================================================================
   4. MENU (IKON DESKTOP) — dibuat dari MENU, bisa digeser & menu lain ikut bergeser
   =================================================================== */
const CW=100,CH=104,PAD=10;   // lebar sel, tinggi sel, margin kisi (px)
let rows=1;                    // jumlah baris per kolom (dihitung ulang di layout())
const byId={};

MENU.forEach(m=>{
  const el=document.createElement(m.href?'a':'button');
  el.className='di';el.dataset.id=m.id;
  if(m.href){el.href=m.href;el.draggable=false}
  if(m.title)el.title=m.title;
  el.innerHTML='<svg><use href="#'+m.icon+'"/></svg>'+m.label;
  $('menu').append(el);byId[m.id]=el;

  // tarik untuk memindahkan → menu lain bergeser mengikuti
  mv(el,el,()=>true,iconMove,iconEnd);
  // setelah ditarik, cegah "klik" yang ikut terpicu (supaya tidak membuka tautan)
  el.addEventListener('click',e=>{if(Date.now()-(el._t||0)<350){e.preventDefault();e.stopImmediatePropagation()}},true);
  if(m.open)el.addEventListener('click',()=>openW(m.open));
});

/* Urutan ikon: dari browser (jika ada) + menu baru yang belum tersimpan */
const savedOrder=load('menu_order');
const order=(Array.isArray(savedOrder)?savedOrder:[]).filter(id=>byId[id]);
MENU.forEach(m=>{if(!order.includes(m.id))order.push(m.id)});

/* Posisi sel ke-k: mengisi ke bawah dulu, lalu pindah kolom */
const slot=k=>[PAD+Math.floor(k/rows)*CW,PAD+k%rows*CH];
/* Tempatkan semua ikon sesuai urutan (skip = ikon yang sedang ditarik) */
function layout(skip){
  rows=Math.max(1,Math.floor((D.clientHeight-PAD)/CH));
  order.forEach((id,k)=>{
    const el=byId[id];if(el===skip)return;
    const p=slot(k);el.style.left=p[0]+'px';el.style.top=p[1]+'px';
  });
}
/* Saat ikon ditarik: cari sel terdekat, sisipkan di sana, ikon lain bergeser */
function iconMove(el){
  const cx=el.offsetLeft+el.offsetWidth/2,cy=el.offsetTop+el.offsetHeight/2;
  const cols=Math.ceil(order.length/rows);
  const c=Math.max(0,Math.min(cols-1,Math.floor((cx-PAD/2)/CW)));
  const r=Math.max(0,Math.min(rows-1,Math.floor((cy-PAD/2)/CH)));
  const to=Math.min(order.length-1,c*rows+r),from=order.indexOf(el.dataset.id);
  if(to!==from){order.splice(from,1);order.splice(to,0,el.dataset.id);layout(el)}
}
/* Saat dilepas: ikon masuk ke selnya & urutan disimpan */
function iconEnd(){layout();save('menu_order',order)}
layout();

/* ===================================================================
   5. JENDELA (.win) — dibuka dari menu {open:'id'}, bisa digeser lewat judul
   =================================================================== */
const W=[...document.querySelectorAll('.win')];
let z=10,n=0;
const front=w=>{w.style.zIndex=++z;W.forEach(x=>x.classList.toggle('act',x===w))};
function openW(id){
  const w=$(id);
  if(!w.dataset.p){w.dataset.p=1;if(innerWidth>700){w.style.left=30+n%6*30+'px';w.style.top=16+n%6*30+'px'}n++} // posisi bertingkat
  w.style.display='flex';front(w);
}
const closeW=w=>{w.style.display='none';delete w.dataset.p};
W.forEach(w=>{
  w.querySelector('.x').onclick=()=>closeW(w);
  w.addEventListener('pointerdown',()=>front(w));
  mv(w,w.querySelector('.tbar'),e=>innerWidth>700&&!e.target.closest('button'));
});

/* ===================================================================
   6. WIDGET MEDIA — isi dari MEDIA; tinggi layar mengikuti rasio video
   =================================================================== */
const chips=MEDIA.map((m,i)=>{
  const b=document.createElement('button');
  b.className='b'+(i?'':' on');b.textContent=m.t;b.onclick=()=>playMedia(m,b);
  $('chips').append(b);return b;
});
function playMedia(m,b){
  chips.forEach(x=>x.classList.toggle('on',x===b));$('now-t').textContent=m.t;
  const id=(m.src.match(/(?:v=|youtu\.be\/|\/live\/)([\w-]{11})/)||[])[1]; // ambil ID YouTube (jika tautan YouTube)
  if(id){ // YouTube → iframe, rasio 16:9
    vid.pause();vid.hidden=true;yt.hidden=false;stage.style.aspectRatio='16/9';
    yt.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1';
  }else{  // file video/audio → <video>
    yt.hidden=true;yt.src='about:blank';vid.hidden=false;vid.src=m.src;vid.play().catch(()=>{});
  }
}
// begitu video siap, samakan rasio kotak dengan rasio video asli → tidak terpotong
vid.addEventListener('loadedmetadata',()=>{stage.style.aspectRatio=vid.videoWidth?vid.videoWidth+'/'+vid.videoHeight:'16/9'});
if(MEDIA.length){vid.src=MEDIA[0].src;$('now-t').textContent=MEDIA[0].t}

/* ===================================================================
   7. WIDGET INFORMASI — banner dari BANNERS; tinggi mengikuti gambar
   =================================================================== */
const BV=$('bn-view'),BT=$('bn-track'),BN=$('bn-n');
let bi=0,bTimer;
BANNERS.forEach((b,i)=>{
  const m=document.createElement('img');
  m.src=b.src;m.alt=b.alt||'Informasi '+(i+1);m.draggable=false;
  m.onload=bnFit;                                  // gambar selesai dimuat → sesuaikan tinggi
  m.onerror=()=>{m.classList.add('bad');bnFit()};  // file tidak ada → kotak abu-abu kecil
  BT.append(m);
});
function bnFit(){const im=BT.children[bi];if(im)BV.style.height=im.clientHeight+'px'} // tinggi = tinggi gambar aktif
function bnGo(i){
  bi=(i+BANNERS.length)%BANNERS.length;
  BT.style.transform='translateX('+(-bi*100)+'%)';
  BN.textContent=(bi+1)+' / '+BANNERS.length;bnFit();
}
function bnAuto(){ // geser otomatis (berhenti saat disorot kursor atau widget diciutkan)
  clearInterval(bTimer);
  if(BANNERS.length>1&&SLIDE_MS)bTimer=setInterval(()=>{if(BV.offsetWidth&&!BV.matches(':hover'))bnGo(bi+1)},SLIDE_MS);
}
new ResizeObserver(bnFit).observe(BV); // widget dilebarkan/dibuka → hitung ulang tinggi
$('prev').onclick=()=>{bnGo(bi-1);bnAuto()};
$('next').onclick=()=>{bnGo(bi+1);bnAuto()};
let sx=null; // geser (swipe) di layar sentuh
BV.addEventListener('pointerdown',e=>sx=e.clientX);
BV.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>40){bnGo(bi+(e.clientX<sx?1:-1));bnAuto()}sx=null});
bnGo(0);bnAuto();

/* ===================================================================
   8. JENDELA ARTIKEL — tombol dari ARTICLES, isi dari <template id="..."> di bawah
   =================================================================== */
ARTICLES.forEach(a=>{
  const b=document.createElement('button');
  b.className='b';b.textContent=a.title;
  b.onclick=()=>{[...$('art-btns').children].forEach(x=>x.classList.toggle('on',x===b));$('abody').innerHTML=$(a.id).innerHTML};
  $('art-btns').append(b);
});

/* ===================================================================
   9. MESIN WIDGET — berlaku untuk SEMUA <aside class="widget">
   Fitur: geser, lebarkan, ciutkan; posisi/lebar/status disimpan per data-wid.
   =================================================================== */
function initWidget(el){
  const key='wg_'+el.dataset.wid,st=load(key),tb=el.querySelector('.tbar'),bt=el.querySelector('.x');
  const isMin=()=>el.classList.contains('min');
  const lbl=()=>{bt.textContent=isMin()?'+':'–';bt.setAttribute('aria-label',isMin()?'Buka widget':'Ciutkan widget')};
  const store=()=>{el._auto=false;save(key,{x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,min:isMin()})};
  // _auto = belum pernah dipindah pengunjung → tetap menempel di pojok data-anchor
  el._auto=st.x===undefined;
  el._place=()=>{
    if(el._auto){const a=el.dataset.anchor||'br'; // tl / tr / bl / br
      put(el,a[1]==='r'?D.clientWidth-el.offsetWidth-12:12,a[0]==='t'?12:D.clientHeight-el.offsetHeight-12);
    }else put(el,el.offsetLeft,el.offsetTop);
  };
  if(st.w&&innerWidth>700)el.style.width=st.w+'px';
  if(st.min??innerWidth<=700)el.classList.add('min'); // di HP awalnya diciutkan
  if(!el._auto){el.style.left=st.x+'px';el.style.top=st.y+'px'}
  lbl();el._place();
  bt.onclick=()=>{el.classList.toggle('min');lbl();el._place();store()};
  mv(el,tb,e=>!e.target.closest('button'),null,store);
  let lw=el.offsetWidth,t;
  new ResizeObserver(()=>{ // ukuran berubah (isi dimuat / dilebarkan) → rapikan posisi
    const wide=el.offsetWidth!==lw;lw=el.offsetWidth;el._place();
    if(wide){clearTimeout(t);t=setTimeout(store,300)}
  }).observe(el);
}
const WG=[...document.querySelectorAll('.widget')];
WG.forEach(initWidget);
addEventListener('resize',()=>{layout();WG.forEach(w=>w._place())});
</script>

<script type="module">
/* ===== 10. FIREBASE — jumlah pengunjung (header) & chat anonim =====
   • Pengunjung : dihitung 1x per browser, ditulis ke statistik_web/total_viewers
   • Chat       : pesan di pesan_anonim (balasan memakai parentId, reaksi wow/super/haha)
   Ganti konfigurasi Firebase di initializeApp({...}) bila memakai proyek lain. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, push, onValue, serverTimestamp, update, increment } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAxf2w0makvkXAD1zBMSJyV4ZD0f05FvDc",
  authDomain: "profil-db4e9.firebaseapp.com",
  databaseURL: "https://profil-db4e9-default-rtdb.firebaseio.com",
  projectId: "profil-db4e9",
  storageBucket: "profil-db4e9.firebasestorage.app",
  messagingSenderId: "897423797460",
  appId: "1:897423797460:web:88b1ef8537397c023d1f41",
  measurementId: "G-G1Y4QE8J06"
});
const db = getDatabase(app), $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

/* ID anonim */
let uid = store.get('arinex_anon_id');
if (!uid) { uid = 'ID-' + Math.random().toString(36).substring(2, 7).toUpperCase(); store.set('arinex_anon_id', uid); }
$('user-identity').textContent = 'Kamu: ' + uid;

/* Pengunjung */
if (!store.get('arinex_has_viewed')) {
  update(ref(db, 'statistik_web'), { total_viewers: increment(1) })
    .then(() => store.set('arinex_has_viewed', 'true'))
    .catch(e => console.error('Gagal mencatat viewer:', e));
}
onValue(ref(db, 'statistik_web/total_viewers'), s => {
  if (s.exists()) $('viewers-count').textContent = Number(s.val()).toLocaleString('id-ID');
});

/* Chat */
const chatRef = ref(db, 'pesan_anonim'), input = $('chat-input'), btn = $('send-chat-btn'), list = $('chat-list'), ind = $('reply-indicator');
let parentId = null;
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const resetReply = () => { parentId = null; ind.style.display = 'none'; input.placeholder = 'Tulis pesan…'; };
$('cancel-reply').onclick = resetReply;

btn.onclick = () => {
  const teks = input.value.trim();
  if (!teks) return;
  btn.textContent = 'Mengirim…'; btn.disabled = true;
  push(chatRef, { userId: uid, teks, waktu: serverTimestamp(), parentId, reactions: { wow: 0, super: 0, haha: 0 } })
    .then(() => {
      input.value = '';
      $('send-status').style.display = 'inline';
      setTimeout(() => $('send-status').style.display = 'none', 3000);
      resetReply();
    })
    .catch(e => { console.error(e); alert('Gagal mengirim pesan. Coba lagi.'); })
    .finally(() => { btn.textContent = 'Kirim pesan'; btn.disabled = false; });
};

function msgDOM(m, isReply) {
  const self = m.userId === uid, r = m.reactions || {}, el = document.createElement('div');
  el.className = 'msg' + (isReply ? ' reply' : '') + (self ? ' self' : '');
  el.innerHTML = `<div class="who">${self ? 'Kamu' : esc(m.userId)}</div><div>${esc(m.teks)}</div>
    <div class="act2"><span>
      <button class="b" data-t="wow">😮 ${r.wow || 0}</button>
      <button class="b" data-t="super">❤️ ${r.super || 0}</button>
      <button class="b" data-t="haha">😂 ${r.haha || 0}</button></span>
      ${isReply ? '' : '<button class="b rp">Balas</button>'}</div>`;
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () =>
    update(ref(db, `pesan_anonim/${m.id}/reactions`), { [b.dataset.t]: increment(1) }));
  const rp = el.querySelector('.rp');
  if (rp) rp.onclick = () => {
    parentId = m.id; ind.style.display = 'flex';
    $('reply-text').textContent = 'Membalas ' + (self ? 'pesanmu sendiri' : m.userId);
    input.placeholder = 'Tulis balasan…'; input.focus();
  };
  return el;
}

onValue(chatRef, snap => {
  list.innerHTML = '';
  if (!snap.exists()) {
    $('msg-count').textContent = '0';
    list.innerHTML = '<div class="msg">Belum ada obrolan. Jadilah yang pertama menulis pesan.</div>';
    return;
  }
  const data = snap.val(), main = [], replies = {};
  Object.keys(data).forEach(k => {
    const m = { id: k, ...data[k] };
    if (!m.parentId) main.push(m); else (replies[m.parentId] ||= []).push(m);
  });
  $('msg-count').textContent = Object.keys(data).length.toLocaleString('id-ID');
  main.reverse().forEach(m => {
    list.appendChild(msgDOM(m, false));
    (replies[m.id] || []).forEach(r => list.appendChild(msgDOM(r, true)));
  });
});
</script>
</body>
