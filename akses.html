/* =========================================
   WINDOWS XP WARNING
========================================= */

.xp-overlay{

  display:flex;
  align-items:center;
  justify-content:center;

  animation:xpFade .2s ease;
}

.xp-window{
  width:100%;
  max-width:470px;
  max-height:92dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#ece9d8;
  color:#222;
  border:1px solid #153e83;
  border-radius:7px;

  animation:xpPop .25s ease;
}

.xp-titlebar{

.xp-title-left{

.xp-logo{

.xp-close{

/* =========================================
   4. AUTHENTICATION STEPS
========================================= */

`).join("");

/* =========================================
   5. DETEKSI MODEL PERANGKAT
========================================= */

async function detectDeviceModel(){

  const ua = navigator.userAgent || "";

  // Gunakan User Agent Client Hints jika tersedia.
  try{

    if(navigator.userAgentData?.getHighEntropyValues){

      const result = await navigator.userAgentData
        .getHighEntropyValues(["model"]);

      if(result.model && result.model.trim()){

        return result.model.trim();

      }

    }

  }catch(error){

    console.warn("Device hints unavailable.");

  }


  // Samsung Galaxy
  const samsung = ua.match(/\bSM-[A-Z0-9-]+\b/i);

  if(samsung){

    return samsung[0].toUpperCase();

  }


  // Android generic model
  const android = ua.match(
    /Android\s[\d.]+;\s*([^;)]+)/i
  );

  if(android){

    const model = android[1]
      .replace(/Build\/.*$/i,"")
      .trim();

    if(model){

      return model;

    }

  }


  // Apple
  if(/iPhone/i.test(ua)){

    return "iPhone (model disembunyikan browser)";

  }

  if(/iPad/i.test(ua)){

    return "iPad";

  }


  // Windows / Mac / Linux
  if(/Windows/i.test(ua)){

    return "Windows PC";

  }

  if(/Macintosh/i.test(ua)){

    return "Macintosh";

  }

  if(/Linux/i.test(ua)){

    return "Linux Device";

  }


  return "Tidak dapat dideteksi";

}


/* =========================================
   6. DETEKSI MEREK
========================================= */

function detectDeviceBrand(model){

  const ua = navigator.userAgent || "";

  const data = (String(model)+" "+ua).toLowerCase();


  if(/samsung|sm-/.test(data)){

    return "Samsung";

  }

  if(/iphone|ipad|ipod|apple/.test(data)){

    return "Apple";

  }

  if(/xiaomi|redmi|poco/.test(data)){

    return "Xiaomi";

  }

  if(/oppo|cph\d+/.test(data)){

    return "OPPO";

  }

  if(/vivo/.test(data)){

    return "vivo";

  }

  if(/realme|rmx\d+/.test(data)){

    return "realme";

  }

  if(/infinix/.test(data)){

    return "Infinix";

  }

  if(/tecno/.test(data)){

    return "TECNO";

  }

  if(/huawei/.test(data)){

    return "Huawei";

  }

  if(/honor/.test(data)){

    return "HONOR";

  }

  if(/google pixel|pixel/.test(data)){

    return "Google";

  }

  if(/oneplus/.test(data)){

    return "OnePlus";

  }

  if(/asus/.test(data)){

    return "ASUS";

  }

  if(/lenovo/.test(data)){

    return "Lenovo";

  }

  if(/windows/.test(data)){

    return "Microsoft";

  }

  if(/macintosh/.test(data)){

    return "Apple";

  }


  return "Tidak dapat dideteksi";

}


/* =========================================
   7. DETEKSI JARINGAN
========================================= */

function detectNetwork(){

  if(!navigator.onLine){

    return {

      status:"Offline",

      detail:"Tidak ada koneksi internet"

    };

  }


  const connection =

    navigator.connection ||

    navigator.mozConnection ||

    navigator.webkitConnection;


  if(!connection){

    return {

      status:"Internet aktif",

      detail:"Jenis jaringan tidak diekspos browser"

    };

  }


  const type = String(
    connection.type || ""
  ).toLowerCase();


  const effective = connection.effectiveType

    ? connection.effectiveType.toUpperCase()

    : "";


  if(type === "cellular"){

    return {

      status:"Seluler",

      detail:"Operator tidak dapat dibaca browser" +
        (effective ? " / "+effective : "")

    };

  }


  if(type === "wifi"){

    return {

      status:"Wi-Fi",

      detail:"SSID / nama jaringan tidak diekspos browser" +
        (effective ? " / "+effective : "")

    };

  }


  if(type === "ethernet"){

    return {

      status:"LAN / Ethernet",

      detail:"Terhubung melalui jaringan kabel"

    };

  }


  if(type === "bluetooth"){

    return {

      status:"Bluetooth",

      detail:"Koneksi melalui Bluetooth"

    };

  }


  return {

    status:"Internet aktif",

    detail:"Jenis koneksi tidak dapat dipastikan" +
      (effective ? " / "+effective : "")

  };

}


/* Pantau perubahan jaringan untuk sesi aktif */

function watchNetwork(){

  const connection =

    navigator.connection ||

    navigator.mozConnection ||

    navigator.webkitConnection;


  if(connection?.addEventListener){

    connection.addEventListener("change",() => {

      console.log("Network changed:",detectNetwork());

    });

  }

}


/* =========================================
   8. LOCAL STORAGE VIEWER
========================================= */

function readLocalStorage(){

  try{

    const entries = [];

    for(let i=0;i<localStorage.length;i++){

      const key = localStorage.key(i);

      if(key === null){

        continue;

      }

      const value = localStorage.getItem(key);

      entries.push({

        key:key,

        value:value ?? ""

      });

    }


    return {

      available:true,

      entries:entries

    };


  }catch(error){

    return {

      available:false,

      entries:[],

      error:error.message

    };

  }

}


/* =========================================
   9. COLLECT ALL DEVICE INFORMATION
========================================= */

async function collectDeviceInfo(){

  const model = await detectDeviceModel();

  return {

    brand:detectDeviceBrand(model),

    model:model,

    network:detectNetwork(),

    id:currentDeviceId || "Belum tersedia",

    localStorage:readLocalStorage()

  };

}


/* =========================================
   10. COPY HELPER
========================================= */

async function copyText(text){

  if(navigator.clipboard?.writeText){

    await navigator.clipboard.writeText(text);

    return true;

  }


  const textarea = document.createElement("textarea");

  textarea.value = text;

  textarea.style.position = "fixed";

  textarea.style.opacity = "0";

  document.body.appendChild(textarea);

  textarea.select();

  const success = document.execCommand("copy");

  textarea.remove();

  return success;

}


/* =========================================
   11. LEAVE PAGE
========================================= */

function leavePage(){

  if(realtimeUnsubscribe){

    realtimeUnsubscribe();

    realtimeUnsubscribe = null;

  }


  if(history.length > 1){

    history.back();

  }else{

    location.replace("about:blank");

  }

}

            </span>

/* =========================================
   13. AUTHENTICATION HALT
========================================= */

function halt(index,title,message){

  mark(index,"bad","akses ditolak");

  void showAccessWarning(title,message);

  throw HALT;

}


/* =========================================
   14. INDEXED DB DEVICE KEY
========================================= */

function getKey(){

  return new Promise((resolve,reject) => {

    const request = indexedDB.open(
      "device-identity",
      1
    );


    request.onupgradeneeded = () => {

      if(!request.result.objectStoreNames.contains("k")){

        request.result.createObjectStore("k");

      }

    };


    request.onerror = () => {

      reject(request.error);

    };


    request.onsuccess = () => {

      const database = request.result;


      if(!database.objectStoreNames.contains("k")){

        database.close();

        reject(new Error("Object Store k tidak ditemukan."));

        return;

      }


      const transaction = database.transaction(
        "k",
        "readonly"
      );


      const query = transaction
        .objectStore("k")
        .get("kp");


      query.onsuccess = () => {

        resolve(query.result);

        database.close();

      };


      query.onerror = () => {

        reject(query.error);

        database.close();

      };

    };

  });

}


/* =========================================
   15. DEVICE FINGERPRINT
========================================= */

async function thumb(jwk){

  const payload = JSON.stringify({

    crv:jwk.crv,

    kty:jwk.kty,

    x:jwk.x,

    y:jwk.y

  });


  const digest = await crypto.subtle.digest(

    "SHA-256",

    new TextEncoder().encode(payload)

  );


  return b64u(new Uint8Array(digest));

}


/* =========================================
   16. MAIN AUTHENTICATION PROCESS
========================================= */

async function run(){


  /* STEP 1: FIREBASE AUTH */

  mark(0,"run");

  let uid;


  try{

    const result = await signInAnonymously(auth);

    uid = result.user.uid;

    mark(0,"ok","sesi aktif");

  }catch(error){

    halt(
      0,
      "Gagal masuk Firebase Authentication",
      error.code || error.message || "Autentikasi Firebase gagal."
    );

  }


  /* STEP 2: DEVICE DATA */

  mark(1,"run");

  let kp;


  try{

    kp = await getKey();

  }catch(error){

    halt(
      1,
      "Gagal membaca identitas perangkat",
      error.message || "Database identitas tidak dapat dibaca."
    );

  }


  if(!kp){

    halt(
      1,
      "Izin perangkat tidak ditemukan",
      "Kunci identitas perangkat tidak ditemukan di browser ini. Perangkat belum dikenali."
    );

  }


  /* CALCULATE DEVICE ID */

  let id;


  try{

    id = await thumb(
      await crypto.subtle.exportKey(
        "jwk",
        kp.publicKey
      )
    );

    currentDeviceId = id;

  }catch(error){

    halt(
      1,
      "Identitas perangkat tidak dikenali",
      error.message || "Kunci perangkat tidak dapat diproses."
    );

  }


  /* READ FIREBASE DEVICE DATA */

  let rec;


  try{

    const snapshot = await get(
      ref(db,"devices/"+id)
    );


    rec = snapshot.exists()
      ? snapshot.val()
      : null;

  }catch(error){

    halt(
      1,
      "Gagal membaca data perangkat",
      error.code || error.message || "Koneksi database gagal."
    );

  }


  if(!rec){

    halt(
      1,
      "Perangkat tidak terdaftar",
      "ID perangkat tidak ditemukan di database Firebase. Perangkat ini belum memiliki izin akses."
    );

  }


  mark(1,"ok",id.slice(0,8)+"…");


  /* STEP 3: PROOF OF OWNERSHIP */

  mark(2,"run");

  let proven = false;


  try{

    if(
      !rec.publicKey ||
      (await thumb(rec.publicKey)) !== id
    ){

      throw new Error("Public key tidak cocok.");

    }


    const algorithm = {

      name:"ECDSA",

      hash:"SHA-256"

    };


    const challenge = crypto.getRandomValues(
      new Uint8Array(16)
    );


    // Sign challenge using private key

    const signature = await crypto.subtle.sign(

      algorithm,

      kp.privateKey,

      challenge

    );


    // Import registered public key

    const publicKey = await crypto.subtle.importKey(

      "jwk",

      {

        kty:rec.publicKey.kty,

        crv:rec.publicKey.crv,

        x:rec.publicKey.x,

        y:rec.publicKey.y,

        ext:true

      },

      {

        name:"ECDSA",

        namedCurve:"P-256"

      },

      false,

      ["verify"]

    );


    // Verify signature

    proven = await crypto.subtle.verify(

      algorithm,

      publicKey,

      signature,

      challenge

    );


  }catch(error){

    proven = false;

  }


  if(!proven){

    halt(
      2,
      "Bukti kepemilikan gagal",
      "Sidik jari perangkat tidak sesuai dengan kunci autentikasi terdaftar. Perangkat tidak dapat diverifikasi."
    );

  }


  mark(2,"ok","signature valid");


  /* STEP 4: DEVICE PERMISSION */

  mark(3,"run");


  if(rec.status !== "allowed"){


    if(rec.status === "blocked"){

      halt(
        3,
        "Perangkat diblokir",
        "Administrator telah memblokir perangkat ini. Hubungi administrator."
      );

    }


    halt(
      3,
      "Izin perangkat belum disetujui",
      "Perangkat masih menunggu persetujuan administrator. Akses belum diberikan."
    );

  }


  mark(3,"ok","diizinkan");


  /* STEP 5: UID MAPPING */

  try{

    await set(
      ref(db,"uidMap/"+uid),
      id
    );

  }catch(error){

    console.warn("UID mapping gagal:",error);

  }


  /* =====================================
     STEP 6: DISPLAY SIMULATION VOUCHER
  ===================================== */

  const voucherHTML = `

    <div class="voucher-card">

      <h2 class="voucher-title">
        Alfamart | Alfagift
      </h2>

      <span class="voucher-demo">
        VOUCHER SIMULASI
      </span>

      <p class="voucher-subtitle">
        VOUCHER BELANJA
      </p>

      <div class="voucher-nominal">
        Rp 100.000
      </div>

      <div class="barcode-container">

        <svg id="barcode"></svg>

      </div>

      <div class="voucher-footer">

        Barcode contoh untuk simulasi tampilan.
        Bukan bukti voucher resmi atau kode penukaran.

        <br><br>

        <span style="font-size:.75rem;color:#888">

          ID Perangkat:

          <code>${esc(id.slice(0,12))}…</code>

        </span>

      </div>

    </div>

  `;


  $("out").innerHTML = voucherHTML;


  // Render demo barcode

  if(window.JsBarcode){

    window.JsBarcode(
      "#barcode",
      "AGF0134SGG6FE",
      {

        format:"CODE128",

        lineColor:"#000",

        width:2.5,

        height:70,

        displayValue:true,

        fontSize:18,

        fontOptions:"bold",

        textMargin:8,

        background:"transparent"

      }
    );

  }


  // Watch network change
  watchNetwork();


  /* =====================================
     STEP 7: REALTIME PERMISSION MONITOR
  ===================================== */

  realtimeUnsubscribe = onValue(

    ref(db,"devices/"+id+"/status"),


    snapshot => {

      const status = snapshot.val();


      if(status !== "allowed"){

        mark(3,"bad","akses dicabut");

        void showAccessWarning(

          "Izin perangkat telah dicabut",

          "Administrator telah mengubah status akses perangkat ini. Sistem mengunci halaman secara otomatis."

        );

      }

    },


    error => {

      void showAccessWarning(

        "Gagal memantau izin perangkat",

        error.message || "Status izin tidak dapat diverifikasi."

      );

    }

  );

}


/* =========================================
   17. EXECUTION
========================================= */

run().catch(error => {

  if(error === HALT){

    return;

  }


  console.error(
    "Authentication error:",
    error
  );


  void showAccessWarning(

    "Kesalahan autentikasi",

    error.code ||
    error.message ||
    "Terjadi kesalahan yang tidak diketahui."

  );

});

</script>
