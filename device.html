<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Identitas Perangkat</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mut:#667085;--line:#e3e7ef;--ok:#16a34a;--wait:#d97706;--bad:#dc2626;--acc:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf5;--mut:#9aa6bd;--line:#2a3347;--acc:#6ea0ff}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 6px}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:16px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row span:first-child{color:var(--mut)}
.row span:last-child{text-align:right;word-break:break-all}
code{font:.85rem ui-monospace,Menlo,Consolas,monospace}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:.85rem;color:#fff;background:var(--wait)}
.badge.allowed{background:var(--ok)}.badge.blocked{background:var(--bad)}
button{font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--line);padding:3px 10px;font-size:.85rem}
#msg{margin-top:10px;min-height:1.4em}
.err{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1></h1>
  <p class="mut"></p>

  <div class="card" id="info"><div class="row"><span>Memuat…</span><span></span></div></div>

  <button id="test" hidden>Uji bukti kepemilikan</button>
  <div id="msg" aria-live="polite"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getDatabase, ref, get, update, onValue, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyA6XKIURZUBI-W9bE3X4c5wz4FFdyOSKGA",
  authDomain: "operational-e52ed.firebaseapp.com",
  databaseURL: "https://operational-e52ed-default-rtdb.firebaseio.com",
  projectId: "operational-e52ed",
  storageBucket: "operational-e52ed.firebasestorage.app",
  messagingSenderId: "378782286599",
  appId: "1:378782286599:web:056bb7ec127a1a56163ba2",
  measurementId: "G-QRH7DH84EE"
}));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");

/* ===== 1. IDENTITAS PERANGKAT: pasangan kunci ECDSA yang TIDAK BISA diekspor =====
   Kunci pribadi dibuat dengan extractable:false dan disimpan di IndexedDB perangkat ini.
   ID perangkat = sidik jari SHA-256 dari kunci publik, jadi tidak bisa dipalsukan tanpa kunci pribadinya.
   Nanti, halaman tertaut cukup meminta perangkat menandatangani sebuah tantangan (lihat prove()). */
const idb = (mode, fn) => new Promise((ok, no) => {
  const r = indexedDB.open("device-identity", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("k");
  r.onerror = () => no(r.error);
  r.onsuccess = () => {
    const tx = r.result.transaction("k", mode), q = fn(tx.objectStore("k"));
    tx.oncomplete = () => ok(q && q.result);
    tx.onerror = () => no(tx.error);
  };
});
const b64u = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function identity() {
  let kp = await idb("readonly", s => s.get("kp"));
  if (!kp) {
    kp = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
    await idb("readwrite", s => s.put(kp, "kp"));
  }
  const j = await crypto.subtle.exportKey("jwk", kp.publicKey);          // kunci publik selalu boleh diekspor
  const jwk = { crv: j.crv, kty: j.kty, x: j.x, y: j.y };
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(JSON.stringify(jwk)));
  return { kp, jwk, id: b64u(new Uint8Array(hash)) };
}
/* Bukti kepemilikan: perangkat menandatangani tantangan acak dengan kunci pribadinya.
   Di sisi server, tanda tangan ini diverifikasi dengan kunci publik yang tersimpan di Firebase. */
async function prove(kp, challenge) {
  const alg = { name: "ECDSA", hash: "SHA-256" };
  const sig = await crypto.subtle.sign(alg, kp.privateKey, challenge);
  return { sig: b64u(new Uint8Array(sig)), ok: await crypto.subtle.verify(alg, kp.publicKey, sig, challenge) };
}
function fallbackId() { // dipakai hanya bila IndexedDB/WebCrypto diblokir (kurang aman)
  try { let i = localStorage.getItem("did"); if (!i) { i = crypto.randomUUID(); localStorage.setItem("did", i); } return i; }
  catch (e) { return null; }
}

/* ===== 2. DATA PERANGKAT ===== */
const ua = navigator.userAgent, P = re => (ua.match(re) || [])[1] || "";
const BR = [[/SM-|GT-|SAMSUNG/i,"Samsung"],[/Pixel/i,"Google"],[/RMX|realme/i,"Realme"],[/CPH|OPPO/i,"OPPO"],[/vivo|\bV\d{4}/i,"vivo"],[/Redmi|POCO|Xiaomi|\bMI \d|\b2\d{6}[A-Z]{1,2}\b|\bM\d{4}[A-Z]\d/i,"Xiaomi"],[/Infinix|\bX\d{3,4}[A-Z]?\b/i,"Infinix"],[/TECNO|\bK[A-Z]\d\b|\bCK\d|\bCL\d/i,"Tecno"],[/itel/i,"itel"],[/ASUS|ZenFone|\bI00[A-Z]/i,"ASUS"],[/OnePlus|\bIN20|\bLE2/i,"OnePlus"],[/HUAWEI|HONOR/i,"Huawei/Honor"],[/moto|\bXT\d{4}/i,"Motorola"],[/Nokia/i,"Nokia"]];
const IPH = {"320x568":"iPhone SE/5s","375x667":"iPhone 6/7/8/SE","375x812":"iPhone X/XS/11 Pro","414x896":"iPhone XR/11/XS Max","390x844":"iPhone 12/13/14","393x852":"iPhone 14 Pro/15/16","428x926":"iPhone 12-14 Plus","430x932":"iPhone 15/16 Plus","402x874":"iPhone 16 Pro","440x956":"iPhone 16 Pro Max"};

async function collect() {
  let model = "", pv = "";
  try { const u = navigator.userAgentData; if (u) { const h = await u.getHighEntropyValues(["model", "platformVersion"]); model = h.model || ""; pv = h.platformVersion || ""; } } catch (e) {}
  const tablet = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const ios = /iPhone|iPod/.test(ua) || tablet;
  let brand = "PC", os = "", osv = "", type = "Desktop";
  if (/Android/.test(ua)) {
    if (!model) { const m = ua.match(/Android [\d.]+;\s*([^;)]+?)(?:\s+Build|\))/); model = m ? m[1] : ""; }
    if (model === "K") model = "";
    os = "Android"; osv = P(/Android ([\d.]+)/); type = /Mobile/.test(ua) ? "Ponsel" : "Tablet";
    brand = (BR.find(b => b[0].test(model || ua)) || [0, "Android"])[1]; model = model || "Tidak terdeteksi";
  } else if (ios) {
    const s = [screen.width, screen.height].sort((a, b) => a - b).join("x");
    brand = "Apple"; os = tablet ? "iPadOS" : "iOS"; osv = P(/OS (\d+[_\d]*) like/).replace(/_/g, ".");
    type = tablet ? "Tablet" : "Ponsel"; model = tablet ? "iPad" : (IPH[s] ? "≈ " + IPH[s] : "iPhone");
  } else if (/Windows/.test(ua)) { os = "Windows"; osv = parseInt(pv) >= 13 ? "11" : P(/Windows NT ([\d.]+)/); model = "Windows"; }
  else if (/Mac OS X/.test(ua)) { brand = "Apple"; os = "macOS"; osv = P(/Mac OS X ([\d_]+)/).replace(/_/g, "."); model = "Mac"; }
  else { os = /CrOS/.test(ua) ? "ChromeOS" : /Linux/.test(ua) ? "Linux" : "Lainnya"; model = os; }
  const browser = /Instagram/.test(ua) ? "Instagram (in-app)" : /FBAN|FBAV/.test(ua) ? "Facebook (in-app)" : /TikTok|musical_ly|Bytedance/i.test(ua) ? "TikTok (in-app)" : /EdgA?\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /Firefox|FxiOS/.test(ua) ? "Firefox" : /CriOS|Chrome/.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : "Lainnya";
  return { brand, model, deviceName: brand + " " + model, type, os, osVersion: osv, browser,
    screen: `${screen.width}x${screen.height}@${devicePixelRatio}`, language: navigator.language || "",
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "", cores: navigator.hardwareConcurrency || 0,
    ram: navigator.deviceMemory || 0, userAgent: ua.slice(0, 300) };
}

/* ===== 3. DAFTARKAN KE FIREBASE & TAMPILKAN ===== */
const ST = { pending: "Menunggu persetujuan", allowed: "Diizinkan", blocked: "Diblokir" };
function show(id, info, bound) {
  const rows = [["Status", `<span class="badge" id="st">…</span>`], ["ID perangkat", `<code>${esc(id)}</code> <button class="sec" id="cp">Salin</button>`],
    ["Perangkat", esc(info.deviceName)], ["Sistem", esc(info.os + " " + info.osVersion)], ["Browser", esc(info.browser)], ["Layar", esc(info.screen)],
    ["Kunci perangkat", bound ? "Terikat di perangkat ✓" : "Tidak tersedia (mode terbatas)"]];
  $("info").innerHTML = rows.map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
  $("cp").onclick = () => navigator.clipboard.writeText(id).then(() => { $("cp").textContent = "Tersalin ✓"; }).catch(() => {});
}
(async () => {
  let idn = null;
  try { idn = await identity(); } catch (e) { console.warn("Kunci perangkat gagal dibuat:", e); }
  const id = idn ? idn.id : fallbackId();
  if (!id) { $("info").innerHTML = '<div class="row err">Penyimpanan browser diblokir (mode privat?). Perangkat tidak bisa didaftarkan.</div>'; return; }
  const info = await collect();
  show(id, info, !!idn);
  try {
    const isNew = !(await get(ref(db, `devices/${id}/firstSeen`))).exists();
    const data = { info, lastSeen: serverTimestamp(), visits: increment(1) };
    if (isNew) Object.assign(data, { firstSeen: serverTimestamp(), status: "pending", keyBound: !!idn, ...(idn ? { publicKey: idn.jwk } : {}) });
    await update(ref(db, "devices/" + id), data);
    onValue(ref(db, `devices/${id}/status`), s => { const v = s.val() || "pending"; $("st").textContent = ST[v] || v; $("st").className = "badge " + v; });
  } catch (e) {
    $("msg").innerHTML = `<span class="err">Gagal menyimpan ke Firebase (${esc(e.code || e.message)}). Periksa Rules.</span>`;
  }
  if (idn) {
    $("test").hidden = false;
    $("test").onclick = async () => {
      const r = await prove(idn.kp, crypto.getRandomValues(new Uint8Array(16)));
      $("msg").textContent = r.ok ? "✓ Perangkat ini terbukti memegang kunci pribadinya." : "✗ Verifikasi gagal.";
    };
  }
})();
</script>
</body>
</html>
